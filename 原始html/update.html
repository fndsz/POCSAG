<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6fe4">
<title>摩托罗拉寻呼发射器 · 固件升级</title>
<style>
:root{
  --bg:#eef2f7; --card:#fff; --line:#d9e2ee; --line2:#eef2f8;
  --tx:#223; --tx2:#6b7787; --pri:#2f6fe4; --pri-d:#2159c0; --pri-bg:#f5f8fd;
  --bad:#d93b3b; --bad-bg:#fff0f0; --ok:#1a8f4c; --warn-bg:#fff5e6; --warn-bd:#ffcf8b; --warn-tx:#8a5a00;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#11151b; --card:#1a2029; --line:#2b3441; --line2:#2a3340;
    --tx:#e6edf5; --tx2:#8b98a8; --pri:#4d8bf0; --pri-d:#3a76d8; --pri-bg:#1c2531;
    --bad:#ff6b6b; --bad-bg:#2a1c1c; --ok:#3ecf7a; --warn-bg:#2a2317; --warn-bd:#6b5320; --warn-tx:#e8c88a;
  }
}
html[data-theme=light]{
  --bg:#eef2f7; --card:#fff; --line:#d9e2ee; --line2:#eef2f8;
  --tx:#223; --tx2:#6b7787; --pri:#2f6fe4; --pri-d:#2159c0; --pri-bg:#f5f8fd;
  --bad:#d93b3b; --bad-bg:#fff0f0; --ok:#1a8f4c; --warn-bg:#fff5e6; --warn-bd:#ffcf8b; --warn-tx:#8a5a00;
}
html[data-theme=dark]{
  --bg:#11151b; --card:#1a2029; --line:#2b3441; --line2:#2a3340;
  --tx:#e6edf5; --tx2:#8b98a8; --pri:#4d8bf0; --pri-d:#3a76d8; --pri-bg:#1c2531;
  --bad:#ff6b6b; --bad-bg:#2a1c1c; --ok:#3ecf7a; --warn-bg:#2a2317; --warn-bd:#6b5320; --warn-tx:#e8c88a;
}
*{box-sizing:border-box;-webkit-text-size-adjust:100%}
body{margin:0;padding:10px 10px 30px;background:var(--bg);color:var(--tx);
     font:16px/1.6 "Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;transition:background .2s}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:20px;margin:10px 0 2px;text-align:center;color:var(--pri)}
.sub{text-align:center;color:var(--tx2);font-size:12px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;
      box-shadow:0 1px 3px rgba(20,60,120,.05)}
.card h2{font-size:16px;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line2);color:var(--pri)}
.card h2 .tgl{float:right;background:none;border:0;color:var(--tx2);font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
.warn{background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn-tx);border-radius:8px;
      padding:10px;font-size:13px;line-height:1.7;margin-bottom:12px}
.err{background:var(--bad-bg);border:1px solid var(--bad);color:var(--bad);border-radius:8px;
     padding:10px;font-size:13px;line-height:1.7;margin-bottom:12px;display:none}
input[type=file]{width:100%;font:inherit;font-size:14px;padding:8px 0}
button{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:12px 14px;font:inherit;font-size:16px;width:100%;cursor:pointer;margin-top:10px}
button:active{background:var(--pri-d)}
button:disabled{background:var(--tx2);opacity:.6;cursor:default}
#bar{display:none;margin-top:12px;height:16px;background:var(--line2);border-radius:8px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--pri);transition:width .2s}
#txt{margin-top:8px;font-size:13px;text-align:center;min-height:22px;line-height:1.7}
#txt.ok{color:var(--ok)}
#txt.bad{color:var(--bad)}
.nav{display:flex;gap:8px;margin:12px 0}
.nav a{flex:1;text-align:center;text-decoration:none;background:var(--card);color:var(--pri);
       border:1px solid var(--pri);border-radius:8px;padding:10px 4px;font-size:15px}
table.kv{width:100%;font-size:14px;border-collapse:collapse}
table.kv td{padding:4px 0;color:var(--tx)}
table.kv td:first-child{color:var(--tx2);width:44%}
.fileinfo{margin-top:8px;padding:9px 10px;background:var(--pri-bg);border:1px dashed var(--line);
          border-radius:8px;font-size:13px;line-height:1.8;display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>摩托罗拉寻呼发射器</h1>
  <p class="sub">WIFI 模块控制 · 固件升级</p>

  <div class="card">
    <h2>固件信息<button type="button" class="tgl" id="theme" title="切换深色/浅色">◐</button></h2>
    <table class="kv">
      <tr><td>固件版本</td><td id="i_fw">-</td></tr>
      <tr><td>编译时间</td><td id="i_build">-</td></tr>
      <tr><td>Sketch 已用</td><td id="i_sketch">-</td></tr>
      <tr><td>可用程序空间</td><td id="i_free">-</td></tr>
      <tr><td>Flash 实际容量</td><td id="i_flash">-</td></tr>
      <tr><td>文件系统</td><td id="i_fs">-</td></tr>
    </table>
  </div>

  <div class="warn">
    <b>传哪个文件：</b>OTA 只接受 Arduino「导出已编译的二进制文件」得到的
    <b>程序 bin</b>（本项目约 400~700 KB）。<br>
    <b>不能传</b>打包脚本合成的 4MB 整片镜像（含文件系统和分区表的那个），
    那个必须用串口烧录。传错会导致设备崩溃。<br>
    <b>编译设置：</b>Flash Size 必须是 <b>4MB (FS:2MB OTA:~1019KB)</b>。
  </div>

  <div class="err" id="err"></div>

  <div class="card">
    <h2>选择固件</h2>
    <form method="POST" action="/update" enctype="multipart/form-data" id="fu">
      <input type="file" name="update" id="file" accept=".bin">
      <button type="submit" id="btn">开始升级</button>
    </form>
    <div class="fileinfo" id="finfo"></div>
    <div id="bar"><i></i></div>
    <div id="txt"></div>
  </div>

  <div class="nav">
    <a href="/">单呼</a>
    <a href="group_call">群呼 / 天气</a>
    <a href="wifi">配置 Wifi</a>
  </div>
</div>

<script>
(function(){
  var t=null;try{t=localStorage.getItem("pocsag-theme");}catch(e){}
  if(t)document.documentElement.setAttribute("data-theme",t);
  $("theme").onclick=function(){
    var cur=document.documentElement.getAttribute("data-theme");
    if(!cur)cur=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
    var nx=cur==="dark"?"light":"dark";
    document.documentElement.setAttribute("data-theme",nx);
    try{localStorage.setItem("pocsag-theme",nx);}catch(e){}
  };
})();
function $(id){return document.getElementById(id);}

var CFG=null, OLD_BUILD="";

/* ---------- ESP8266 固件头解析 ----------
   前 4 字节：E9 / 段数 / Flash 模式 / (Flash容量<<4 | 频率)
   靠这个能在上传前就判断出 bin 是按哪种 Flash 布局编译的，
   顺便挡掉「把整片镜像当固件传」这种会把设备搞崩的操作。 */
var FLASH_SIZE={0:"512KB",1:"256KB",2:"1MB",3:"2MB",4:"4MB",5:"2MB(c1)",6:"4MB(c1)",8:"8MB",9:"16MB"};
var FLASH_FREQ={0:"40MHz",1:"26MHz",2:"20MHz",15:"80MHz"};
var FLASH_MODE={0:"QIO",1:"QOUT",2:"DIO",3:"DOUT"};
var SIZE_MB={0:0.5,1:0.25,2:1,3:2,4:4,5:2,6:4,8:8,9:16};

function kb(n){return Math.round(n/1024)+" KB";}

function loadInfo(){
  fetch("cfg?t="+Date.now()).then(function(r){return r.json();}).then(function(c){
    CFG=c;
    $("i_fw").textContent=c.fw||"-";
    $("i_build").textContent=c.build||"-";
    $("i_sketch").textContent=c.sketch||"-";
    $("i_free").textContent=c.free||"-";
    $("i_flash").textContent=c.flash||"-";
    $("i_fs").textContent=c.fs||"-";
    OLD_BUILD=c.build||"";
  }).catch(function(){
    $("i_fw").textContent="-";
  });
}

/* ---------- 选择文件后先体检 ---------- */
var CUR=null;
$("file").addEventListener("change",function(){
  var f=this.files[0];
  CUR=null;
  $("err").style.display="none";
  $("finfo").style.display="none";
  $("txt").className="";$("txt").textContent="";
  if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    var b=new Uint8Array(rd.result);
    var info={name:f.name,size:f.size,ok:true,msg:[],head:b};
    if(b.length<4){info.ok=false;info.msg.push("文件太小，不是有效的固件");}
    else{
      if(b[0]!==0xE9){
        info.ok=false;
        info.msg.push("不是合法的 ESP8266 固件（首字节应为 E9，实际 "+b[0].toString(16).toUpperCase()+"）");
      }else{
        var sn=b[3]>>4, fn=b[3]&0x0F, md=b[2];
        info.fsize=FLASH_SIZE[sn]||("代码"+sn);
        info.ffreq=FLASH_FREQ[fn]||("代码"+fn);
        info.fmode=FLASH_MODE[md]||("代码"+md);
        info.sizeMB=SIZE_MB[sn];
        info.msg.push("按 <b>"+info.fsize+"</b> Flash、"+info.fmode+"、"+info.ffreq+" 编译");

        // 设备容量 vs 固件声明容量
        if(CFG&&CFG.flashb&&info.sizeMB&&Math.abs(info.sizeMB-CFG.flashb/1048576)>0.01){
          info.ok=false;
          info.msg.push("这个固件是按 "+info.fsize+" Flash 编译的，但设备实际是 "+
                        (CFG.flashb/1048576)+" MB，请先按 4MB (FS:2MB OTA:~1019KB) 重新编译");
        }
      }
    }
    // 大小检查：这是挡住整片镜像的关键一道
    if(CFG&&CFG.freesp&&f.size>CFG.freesp){
      info.ok=false;
      info.msg.push("固件 "+kb(f.size)+" 超过可用程序空间 "+kb(CFG.freesp)+"。<b>整片 Flash 镜像不能用 OTA 传</b>，那是串口烧录用的一整包文件，请改用 Arduino 导出的程序 bin");
    }
    // 整片镜像的典型特征：体积接近整个 Flash
    if(CFG&&CFG.flashb&&f.size>CFG.flashb*0.75){
      info.ok=false;
      info.msg.push("这个文件有 "+kb(f.size)+"，几乎占了整片 Flash —— 很可能是打包脚本合成的<b>整片镜像</b>，OTA 传它会让设备崩溃。请改用串口烧录，或换成程序 bin");
    }
    CUR=info;
    showInfo(info);
  };
  rd.readAsArrayBuffer(f.slice(0,8));
});

function showInfo(i){
  var box=$("finfo");
  box.innerHTML="";
  box.style.display="block";
  var l1=document.createElement("div");
  l1.textContent="文件："+i.name+"（"+kb(i.size)+"）";
  box.appendChild(l1);
  i.msg.forEach(function(m){
    var d=document.createElement("div");
    d.style.color=i.ok?"":"";
    d.innerHTML=(i.ok?"✓ ":"✗ ")+m;
    box.appendChild(d);
  });
  $("btn").disabled=!i.ok;
  if(!i.ok){
    var e=$("err");
    e.innerHTML="<b>不能升级：</b>";
    i.msg.forEach(function(m){e.innerHTML+="<br>· "+m;});
    e.style.display="block";
  }
}

/* ---------- 上传 ---------- */
function setTxt(t,cls){
  $("txt").className=cls||"";
  $("txt").innerHTML=t;
}

// 关键：上传结束（哪怕报网络错误）都不能直接判失败。
// 设备可能在回响应之前就重启了 —— 那其实是成功。所以一律去轮询确认。
var pollT=null;
function waitBack(){
  var t0=Date.now(), TIMEOUT=45000;
  setTxt("上传完成，正在等待设备重启...","");
  if(pollT)clearInterval(pollT);
  pollT=setInterval(function(){
    var el=Date.now()-t0;
    fetch("cfg?t="+Date.now()).then(function(r){return r.json();}).then(function(c){
      if(c.build&&OLD_BUILD&&c.build!==OLD_BUILD){
        clearInterval(pollT);pollT=null;
        setTxt("✓ 升级成功（新固件编译于 "+c.build+"），正在跳转...","ok");
        setTimeout(function(){location.href="/";},2500);
      }else if(el>30000){
        // 设备活着，但固件没换 —— 说明这次没刷进去
        clearInterval(pollT);pollT=null;
        setTxt("✗ 设备已恢复，但固件没有变化（编译时间仍是 "+c.build+"）。<br>可能是文件传坏了或写入失败，请重新导出 bin 再试；若反复失败请用串口烧录。","bad");
        $("btn").disabled=false;
      }else{
        setTxt("等待设备重启...（已 "+(el/1000).toFixed(0)+" 秒，设备还是旧固件）","");
      }
    }).catch(function(){
      if(el>TIMEOUT){
        clearInterval(pollT);pollT=null;
        setTxt("✗ 设备一直没有恢复响应。<br>新固件可能没启动起来（常见原因是上传了整片镜像或 Flash 布局不符），请用串口重新烧录。","bad");
        $("btn").disabled=false;
      }else{
        setTxt("等待设备重启...（已 "+(el/1000).toFixed(0)+" 秒）","");
      }
    });
  },2000);
}

$("fu").addEventListener("submit",function(e){
  e.preventDefault();
  if(!CUR){setTxt("请先选择 .bin 文件","bad");return;}
  if(!CUR.ok){setTxt("文件未通过校验，请看上方提示","bad");return;}
  var f=$("file").files[0];
  $("bar").style.display="block";
  $("bar").firstChild.style.width="0%";
  $("btn").disabled=true;
  $("err").style.display="none";

  var xhr=new XMLHttpRequest();
  xhr.open("POST","/update",true);
  xhr.upload.onprogress=function(ev){
    if(ev.lengthComputable){
      var p=Math.round(ev.loaded*100/ev.total);
      $("bar").firstChild.style.width=p+"%";
      setTxt("上传中 "+p+"%","");
    }
  };
  xhr.onload=function(){
    var r=xhr.responseText||"";
    if(xhr.status===200&&r.indexOf("OK")===0){
      setTxt("写入成功，设备即将重启...","ok");
      waitBack();
    }else{
      setTxt("✗ 升级失败："+(r||("HTTP "+xhr.status)),"bad");
      $("btn").disabled=false;
    }
  };
  xhr.onerror=function(){
    // 断连不等于失败：设备可能已经刷好并在回响应前重启了。去确认一下。
    setTxt("连接中断，正在确认设备状态...","");
    waitBack();
  };
  xhr.send(f);
});

loadInfo();
</script>
</body>
</html>
